<!doctype html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>隣のAI — 動く試作</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&family=Zen+Maru+Gothic:wght@500;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#F9F6EF;color:#191919;font-family:Nunito,"Zen Maru Gothic",sans-serif;padding:26px 18px 60px}
.wrap{max-width:760px;margin:0 auto}
h1{font-family:"Zen Maru Gothic";font-size:24px;font-weight:700;letter-spacing:.01em}
.lead{font-size:12.5px;color:#7a7369;margin-top:6px;line-height:1.8}
form{margin-top:18px;background:#FEFDFC;border:1px solid #EDE8DE;border-radius:18px;padding:14px;display:grid;gap:9px}
label{font-family:"JetBrains Mono";font-size:9.5px;letter-spacing:.16em;color:#8d8578}
input,textarea{width:100%;border:1px solid #E7E1D6;background:#fff;padding:11px 15px;font-family:inherit;font-size:13.5px;color:#191919;outline:none}
input{border-radius:999px}
textarea{border-radius:14px;resize:vertical;min-height:76px;line-height:1.7;font-family:"JetBrains Mono",Nunito,sans-serif;font-size:12px}
input:focus,textarea:focus{border-color:#BAABC4;box-shadow:0 0 0 3px rgba(186,171,196,.22)}
button{border:0;border-radius:999px;background:#000;color:#fff;padding:13px;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer}
button:disabled{opacity:.35;cursor:default}
.stage{margin-top:16px;background:#FEFDFC;border:1px solid #EDE8DE;border-radius:18px;overflow:hidden}
.bar{display:flex;align-items:center;gap:8px;padding:10px 13px;border-bottom:1px solid #F2EEE6;font-size:11px;color:#7a7369}
.bar .cnt{margin-left:auto;font-family:"JetBrains Mono";font-size:9.5px;color:#a9a196}
.sp{width:8px;height:8px;border-radius:50%;background:#DED7C9}
.sp.on{background:#BAABC4;animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(186,171,196,.65)}70%{box-shadow:0 0 0 8px rgba(186,171,196,0)}100%{box-shadow:0 0 0 0 rgba(186,171,196,0)}}
.view{background:#F1EDE4;min-height:150px;display:flex;align-items:center;justify-content:center;position:relative}
.view img{width:100%;display:block}
.view .ph{font-size:12px;color:#a9a196}
.log{font-family:"JetBrains Mono";font-size:10.5px;color:#6d6659;padding:10px 13px;display:grid;gap:4px;min-height:34px;max-height:150px;overflow:auto}
.log i{font-style:normal;color:#baa8c9}
.result{margin-top:16px;display:none;gap:14px;grid-template-columns:1fr}
.result.on{display:grid}
.card{background:#FEFDFC;border:1px solid #EDE8DE;border-radius:18px;padding:16px}
.hd{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
.hd h2{font-family:"Zen Maru Gothic";font-size:14.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hd .host{font-family:"JetBrains Mono";font-size:10px;color:#a9a196;flex:0 0 auto}
.hd .ok{margin-left:auto;flex:0 0 auto;font-family:"JetBrains Mono";font-size:10px;color:#3f7d52;background:#EDF6EF;border-radius:999px;padding:2px 8px}
.hd .ok.no{color:#a4553f;background:#FBEEEA}
.ans{font-size:13.5px;line-height:1.9}
.srcs{margin-top:12px;display:grid;gap:9px}
.s{border-top:1px solid #F2EEE6;padding-top:9px}
.s .t{font-size:12px;font-weight:700;line-height:1.6}
.s .q{margin-top:4px;font-size:11px;line-height:1.7;color:#5d574e;background:#FAF7F0;border-left:2px solid #BAABC4;padding:7px 9px;border-radius:0 6px 6px 0;white-space:pre-wrap}
.s .f{margin-top:5px;display:flex;gap:8px;align-items:center;font-family:"JetBrains Mono";font-size:9px;color:#a9a196}
.bd{border-radius:999px;padding:2px 7px;font-size:8.5px;letter-spacing:.04em}
.bd.ok{background:#EDF6EF;color:#3f7d52}
.bd.ng{background:#FBEEEA;color:#a4553f}
.note{margin-top:2px;font-size:11px;color:#8d8578;line-height:1.8}
.lgd{font-family:"JetBrains Mono";font-size:9px;color:#a9a196}
</style></head><body>
<div class="wrap">
  <h1>隣のAI <span style="font-family:'JetBrains Mono';font-size:10px;color:#a9a196;letter-spacing:.16em">WORKING PROTOTYPE</span></h1>
  <p class="lead">URLを渡すと、AIがブラウザで実際に開いて本文を読み、原文と一緒に答えを返します。1回のブラウザで最大5サイトまで順に巡回します。デザインは仮。動くことの確認用。</p>

  <form id="f">
    <div><label>QUESTION</label><input id="q" value="月額の料金プランを教えて" autocomplete="off"></div>
    <div><label>TARGET URLS（改行・カンマ区切り／最大5）</label><textarea id="u" spellcheck="false">https://spiritt.ai/
https://invox.jp/
https://manus.im/</textarea></div>
    <button id="go">任せる</button>
  </form>

  <div class="stage">
    <div class="bar"><span class="sp" id="sp"></span><span id="st">待機中</span><span class="cnt" id="cnt"></span></div>
    <div class="view"><img id="img" alt="" style="display:none"><span class="ph" id="ph">まだ動いていない</span></div>
    <div class="log" id="log"></div>
  </div>

  <div class="result" id="res"></div>
  <p class="note" id="note" style="display:none">✓ n/n は「抜き出しがページ本文にそのまま存在するか」の機械チェック。外れている行は引用が言い換えられているので、根拠として弱い。</p>
</div>
<script>
(function(){
  var FN = "https://solene-0e598278.base44.app/functions/agentRun";
  var $ = function(id){ return document.getElementById(id); };
  var es = null, sites = [], started = 0, t0 = 0;

  function log(t, strong){
    var d = document.createElement("div");
    d.innerHTML = (strong ? "<i>›</i> " : "") + esc(t);
    $("log").appendChild(d);
    $("log").scrollTop = 1e6;
  }
  function esc(s){ return String(s || "").replace(/[&<>]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c]; }); }
  function host(u){ try { return new URL(u).host.replace(/^www\./,""); } catch(_) { return u; } }

  function urls(){
    return $("u").value.split(/[\n,、]+/).map(function(s){ return s.trim(); }).filter(Boolean).slice(0,5);
  }

  $("f").addEventListener("submit", function(e){
    e.preventDefault();
    var q = $("q").value.trim(), list = urls();
    if (!q || !list.length) return;
    if (es) { try { es.close(); } catch(_){} es = null; }
    sites = []; started = list.length; t0 = Date.now();
    $("log").innerHTML = ""; $("res").innerHTML = ""; $("res").classList.remove("on"); $("note").style.display = "none";
    $("img").style.display = "none"; $("ph").style.display = "block"; $("ph").textContent = "起動中…";
    $("go").disabled = true; $("go").textContent = "作業中…";
    $("sp").classList.add("on"); $("st").textContent = "作業中"; $("cnt").textContent = "1 セッション / " + list.length + " サイト";

    es = new EventSource(FN + "?q=" + encodeURIComponent(q) + "&url=" + encodeURIComponent(list.join(",")));
    es.addEventListener("status", function(e){
      var d = JSON.parse(e.data);
      $("st").textContent = d.label || d.step;
      log(d.label || d.step, true);
    });
    es.addEventListener("frame", function(e){
      var d = JSON.parse(e.data);
      $("img").src = "data:image/jpeg;base64," + d.jpeg;
      $("img").style.display = "block"; $("ph").style.display = "none";
    });
    es.addEventListener("site", function(e){ sites[JSON.parse(e.data).i] = JSON.parse(e.data); });
    es.addEventListener("result", function(e){ show(JSON.parse(e.data)); });
    es.addEventListener("error", function(e){
      if (e.data) { try { log("エラー: " + JSON.parse(e.data).error); } catch(_){} }
      finish();
    });
    es.addEventListener("done", function(){ finish(); });
    es.onerror = function(){ if (es && es.readyState === 2) finish(); };
  });

  function finish(){
    if (es) { try { es.close(); } catch(_){} es = null; }
    $("go").disabled = false; $("go").textContent = "任せる";
    $("sp").classList.remove("on"); $("st").textContent = "完了";
  }

  function show(r){
    var box = $("res");
    box.innerHTML = "";
    var list = r.sites || [r];
    list.forEach(function(s){
      var okCount = (s.claims || []).filter(function(c){ return c.inSource; }).length;
      var d = document.createElement("div");
      d.className = "card";
      var head = '<div class="hd"><h2>' + esc(s.title || host(s.url)) + '</h2><span class="host">' + esc(host(s.url)) + "</span>" +
        '<span class="ok' + (okCount ? "" : " no") + '">' + (okCount ? "✓ " + okCount + "/" + (s.claims || []).length : "根拠なし") + "</span></div>";
      var body = '<div class="ans">' + esc(s.answer || "") + "</div>";
      var srcs = "";
      (s.claims || []).forEach(function(c, i){
        srcs += '<div class="s"><div class="t">' + (i + 1) + ". " + esc(c.text) + "</div>" +
          '<div class="q">' + esc(c.excerpt) + "</div>" +
          '<div class="f"><span class="bd ' + (c.inSource ? "ok" : "ng") + '">' + (c.inSource ? "✓ 原文一致" : "言い換え") + "</span><span>本文 " + (s.chars || 0) + " 文字</span></div></div>";
      });
      d.innerHTML = head + body + (srcs ? '<div class="srcs">' + srcs + "</div>" : "");
      box.appendChild(d);
    });
    box.classList.add("on");
    $("note").style.display = "block";
    var total = (r.sites || []).length, matched = 0, claimsAll = 0;
    (r.sites || []).forEach(function(s){
      matched += (s.claims || []).filter(function(c){ return c.inSource; }).length;
      claimsAll += (s.claims || []).length;
    });
    $("cnt").textContent = total + " サイト / " + (r.sessions || 1) + " セッション / " + (r.ms / 1000).toFixed(1) + "秒";
    log("完了 " + r.ms + "ms / 根拠 " + matched + "/" + claimsAll + " が原文一致", true);
  }
  $("cnt").textContent = "最大5サイト / 1セッション";
})();
</script></body></html>
