<!doctype html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>隣のAI — 動く試作</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&family=Zen+Maru+Gothic:wght@400;500;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#F9F6EF;color:#191919;font-family:Nunito,"Zen Maru Gothic",sans-serif;padding:26px 18px 60px}
.wrap{max-width:760px;margin:0 auto}
h1{font-family:"Zen Maru Gothic";font-size:24px;font-weight:700;letter-spacing:.01em}
.lead{font-size:12.5px;color:#7a7369;margin-top:6px;line-height:1.8}
form{margin-top:18px;background:#FEFDFC;border:1px solid #EDE8DE;border-radius:18px;padding:14px;display:grid;gap:9px}
label{font-family:"JetBrains Mono";font-size:9.5px;letter-spacing:.16em;color:#8d8578}
input{width:100%;border:1px solid #E7E1D6;background:#fff;border-radius:999px;padding:11px 15px;font-family:inherit;font-size:13.5px;color:#191919;outline:none}
input:focus{border-color:#BAABC4;box-shadow:0 0 0 3px rgba(186,171,196,.22)}
button{border:0;border-radius:999px;background:#000;color:#fff;padding:13px;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer}
button:disabled{opacity:.35;cursor:default}
.stage{margin-top:16px;background:#FEFDFC;border:1px solid #EDE8DE;border-radius:18px;overflow:hidden}
.bar{display:flex;align-items:center;gap:8px;padding:10px 13px;border-bottom:1px solid #F2EEE6;font-size:11px;color:#7a7369}
.sp{width:8px;height:8px;border-radius:50%;background:#DED7C9}
.sp.on{background:#BAABC4;animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(186,171,196,.65)}70%{box-shadow:0 0 0 8px rgba(186,171,196,0)}100%{box-shadow:0 0 0 0 rgba(186,171,196,0)}}
.view{background:#F1EDE4;min-height:150px;display:flex;align-items:center;justify-content:center;position:relative}
.view img{width:100%;display:block}
.view .ph{font-size:12px;color:#a9a196}
.log{font-family:"JetBrains Mono";font-size:10.5px;color:#6d6659;padding:10px 13px;display:grid;gap:4px;min-height:34px}
.log i{font-style:normal;color:#baa8c9}
.result{margin-top:16px;display:none}
.result.on{display:block}
.card{background:#FEFDFC;border:1px solid #EDE8DE;border-radius:18px;padding:16px}
.card h2{font-family:"Zen Maru Gothic";font-size:15px;font-weight:700;margin-bottom:8px}
.ans{font-size:13.5px;line-height:1.9}
.meta{margin-top:12px;display:flex;gap:14px;flex-wrap:wrap;font-family:"JetBrains Mono";font-size:9.5px;color:#a9a196}
.srcs{margin-top:14px;display:grid;gap:10px}
.s{border-top:1px solid #F2EEE6;padding-top:10px}
.s .t{font-size:12.5px;font-weight:700}
.s .q{margin-top:4px;font-size:11.5px;line-height:1.7;color:#5d574e;background:#FAF7F0;border-left:2px solid #BAABC4;padding:7px 9px;border-radius:0 6px 6px 0;white-space:pre-wrap}
.s .f{margin-top:5px;display:flex;gap:8px;align-items:center;font-family:"JetBrains Mono";font-size:9px;color:#a9a196}
.bd{border-radius:999px;padding:2px 7px;font-size:8.5px;letter-spacing:.04em}
.bd.ok{background:#EDF6EF;color:#3f7d52}
.bd.ng{background:#FBEEEA;color:#a4553f}
.note{margin-top:14px;font-size:11px;color:#8d8578;line-height:1.8}
</style></head><body>
<div class="wrap">
  <h1>隣のAI <span style="font-family:'JetBrains Mono';font-size:10px;color:#a9a196;letter-spacing:.16em">WORKING PROTOTYPE</span></h1>
  <p class="lead">URLを渡すと、AIがブラウザで実際に開いて本文を読み、原文と一緒に答えを返します。デザインは仮。動くことの確認用。</p>

  <form id="f">
    <div><label>QUESTION</label><input id="q" value="月額の料金プランを教えて" autocomplete="off"></div>
    <div><label>TARGET URL</label><input id="u" value="https://invox.jp/" autocomplete="off"></div>
    <button id="go">任せる</button>
  </form>

  <div class="stage">
    <div class="bar"><span class="sp" id="sp"></span><span id="st">待機中</span></div>
    <div class="view"><img id="img" alt="" style="display:none"><span class="ph" id="ph">まだ動いていない</span></div>
    <div class="log" id="log"></div>
  </div>

  <div class="result" id="res">
    <div class="card">
      <h2>結論</h2>
      <div class="ans" id="ans"></div>
      <div class="meta" id="meta"></div>
      <div class="srcs" id="srcs"></div>
    </div>
    <p class="note">原文一致は「抜き出しがページ本文にそのまま存在するか」の機械チェック。外れているときは引用が言い換えられているので、その行は根拠として弱い。</p>
  </div>
</div>
<script>
(function(){
  var FN = "https://solene-0e598278.base44.app/functions/agentRun";
  var $ = function(id){ return document.getElementById(id); };
  var es = null;

  function log(t, strong){
    var d = document.createElement("div");
    d.innerHTML = (strong ? "<i>›</i> " : "") + t;
    $("log").appendChild(d);
  }

  $("f").addEventListener("submit", function(e){
    e.preventDefault();
    var q = $("q").value.trim(), u = $("u").value.trim();
    if (!q || !u) return;
    if (es) { try { es.close(); } catch(_){} es = null; }
    $("log").innerHTML = ""; $("res").classList.remove("on");
    $("img").style.display = "none"; $("ph").style.display = "block"; $("ph").textContent = "起動中…";
    $("go").disabled = true; $("go").textContent = "作業中…";
    $("sp").classList.add("on"); $("st").textContent = "作業中";

    var t0 = Date.now();
    es = new EventSource(FN + "?q=" + encodeURIComponent(q) + "&url=" + encodeURIComponent(u));
    es.addEventListener("status", function(e){
      var d = JSON.parse(e.data);
      $("st").textContent = d.label || d.step;
      log(d.label || d.step, true);
    });
    es.addEventListener("frame", function(e){
      var d = JSON.parse(e.data);
      $("img").src = "data:image/jpeg;base64," + d.jpeg;
      $("img").style.display = "block"; $("ph").style.display = "none";
    });
    es.addEventListener("result", function(e){ show(JSON.parse(e.data)); });
    es.addEventListener("error", function(e){
      if (e.data) { try { log("エラー: " + JSON.parse(e.data).error); } catch(_){} }
      finish();
    });
    es.addEventListener("done", function(){ finish(); });
    es.onerror = function(){ if (es && es.readyState === 2) finish(); };
  });

  function finish(){
    if (es) { try { es.close(); } catch(_){} es = null; }
    $("go").disabled = false; $("go").textContent = "任せる";
    $("sp").classList.remove("on"); $("st").textContent = "完了";
  }

  function show(r){
    $("ans").textContent = r.answer || "";
    $("meta").innerHTML = [
      "URL " + r.url,
      "本文 " + r.chars + " 文字",
      r.ms + " ms",
      "確認 " + new Date(r.checkedAt).toLocaleString("ja-JP")
    ].map(function(x){ return "<span>" + x + "</span>"; }).join("");
    var box = $("srcs");
    box.innerHTML = "";
    (r.claims || []).forEach(function(c, i){
      var d = document.createElement("div");
      d.className = "s";
      d.innerHTML =
        '<div class="t">' + (i+1) + ". " + esc(c.text) + "</div>" +
        '<div class="q">' + esc(c.excerpt) + "</div>" +
        '<div class="f"><span class="bd ' + (c.inSource ? "ok" : "ng") + '">' + (c.inSource ? "原文一致" : "言い換え") + '</span><span>' + esc(r.title || "") + "</span></div>";
      box.appendChild(d);
    });
    if (!(r.claims || []).length){
      box.innerHTML = '<div class="s"><div class="t">根拠を取れませんでした</div><div class="q">' + esc((r.preview || "").slice(0, 200)) + "</div></div>";
    }
    $("res").classList.add("on");
    log("完了 " + r.ms + "ms / 根拠 " + (r.claims || []).length + " 件", true);
  }

  function esc(s){ return String(s || "").replace(/[&<>]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c]; }); }
})();
</script></body></html>
